schema: spec-driven
version: "1.0"
project: vitia
initialized: "2026-06-25"

context: |
  Project: Vitia — single-user personal nutrition tracker (Spain market only).
  Framework: Expo SDK 54, React Native 0.81, expo-router (file-based routing under app/).
  Language: TypeScript strict mode (~5.9). UI language is Spanish; code/artifacts are English.
  Local DB: expo-sqlite 16 + drizzle-orm 0.44 (schema at db/schema.ts, repositories at db/repositories/).
  State: Zustand 5. Forms: React Hook Form + Zod. Styling: NativeWind v4 + Tailwind CSS.
  External API: Open Food Facts (Spain locale, client at lib/openFoodFacts.ts).
  Distribution: Expo Go / direct APK/IPA. No App Store review. No multi-tenancy.
  Branch strategy: feature/* → main via PR. Conventional commits. No AI attribution.

testing:
  strict_tdd: true
  test_runner: jest
  test_command: "npm test"
  test_match: "**/__tests__/**/*.test.ts"
  lint_command: "npm run lint"
  typecheck_command: "npm run typecheck"
  format_command: "npm run format"
  layers:
    unit: true
    integration: false
    e2e: false
  coverage: false

rules:
  proposal:
    - Include rollback plan for risky DB or store changes.
    - Scope each proposal to a single coherent user-facing slice.
    - Flag any OFF API calls or SQLite schema changes explicitly.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Reference db/schema.ts for data-model constraints.
  design:
    - Include sequence diagrams for flows involving OFF API or DB writes.
    - Document architecture decisions with rationale.
    - Follow existing container-presentational split (screens in app/, logic in stores/ and lib/).
  tasks:
    - Group by phase, use hierarchical numbering (1.1, 1.2 …).
    - Keep tasks completable in one focused session.
    - Always include a DB migration task when schema changes.
  apply:
    - Follow existing code patterns (NativeWind className, @/ imports, Zustand stores).
    - Never call OFF API directly from components — always use lib/openFoodFacts.ts.
    - Never edit db/migrations/ by hand; always run npx drizzle-kit generate.
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run typecheck && npm run lint"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive delta specs.
    - Update AGENTS.md key files table when new modules are introduced.
